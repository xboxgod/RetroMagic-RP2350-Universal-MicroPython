name: Build RetroMagic RP2350

on:
  schedule:
    - cron: '0 8 * * *' # 每天 UTC 08:00 自动检查编译
  workflow_dispatch: # 支持手动触发
  push:
    branches:
      - main

# 🔑 赋予 GitHub Actions 创建 Release 和上传文件的写权限
permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MicroPython Master Branch
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          submodules: true
          fetch-depth: 0

      - name: Get MicroPython Official Version & Commit
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          COMMIT=$(git rev-parse --short HEAD)
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "MicroPython Version: $CLEAN_VERSION ($COMMIT)"

      - name: Smart Check Build Eligibility
        id: check_release
        run: |
          # 手动触发或 Push 触发时强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \vert{}\vert{} [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🚀 手动/推送触发，强制启动构建。"
          else
            # 定时触发时，检查最新 Release 是否已存在
            TAG_NAME="${{ steps.get_version.outputs.version }}"
            HTTP_STATUS=$(curl -s -o /dev/null -w "\%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG_NAME}")
            
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "⏭️ 版本 ${TAG_NAME} 已存在，跳过构建。"
            else
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "🚀 发现 MicroPython 新版本 ${TAG_NAME}，启动构建！"
            fi
          fi

      - name: Install Build Dependencies
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi cmake ninja-build python3 libusb-1.0-0-dev

      - name: Build mpy-cross and Update Submodules
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          make -C mpy-cross -j$(nproc)
          make -C ports/rp2 submodules

      - name: Setup Board Configuration
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          BOARD_DIR="ports/rp2/boards/RETROMAGIC_RP2350"
          mkdir -p $BOARD_DIR

          cat << 'EOF' > $BOARD_DIR/mpconfigboard.cmake
          set(MICROPY_BOARD_TARGET "rp2350-arm-s")
          set(PICO_BOARD "pico2")
          EOF

          cat << 'EOF' > $BOARD_DIR/mpconfigboard.h
          #ifndef MICROPY_INCLUDED_MPCONFIGBOARD_H
          #define MICROPY_INCLUDED_MPCONFIGBOARD_H

          #define MICROPY_HW_BOARD_NAME "RetroMagic RP2350"
          #define MICROPY_HW_MCU_NAME   "RP2350"

          #endif // MICROPY_INCLUDED_MPCONFIGBOARD_H
          EOF

      - name: Matrix Compile (2MB, 4MB, 8MB, 16MB)
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          CLEAN_MP_VERSION="${{ steps.get_version.outputs.version }}"
          cd ports/rp2

          SIZES=("2" "4" "8" "16")
          BYTES_LIST=(2097152 4194304 8388608 16777216)

          for i in "${!SIZES[@]}"; do
            SIZE="${SIZES[$i]}"
            BYTES="${BYTES_LIST[$i]}"
            BUILD_DIR="build-RETROMAGIC_RP2350_${SIZE}MB"
            TARGET_FILENAME="RetroMagic_MicroPython_RP2350_${SIZE}MB_${CLEAN_MP_VERSION}.uf2"

            echo "=================================================="
            echo "🚀 开始编译 ${SIZE}MB 版本 (Flash Bytes: ${BYTES})..."
            echo "=================================================="

            rm -rf "${BUILD_DIR}"

            make BOARD=RETROMAGIC_RP2350 \
                 BUILD="${BUILD_DIR}" \
                 CMAKE_ARGS="-DPICO_FLASH_SIZE_BYTES=${BYTES} -DPICO_EMBED_XIP_SETUP=1 -DPICO_FLASH_SPI_CLKDIV=6" \
                 -j$(nproc)

            if [ -f "${BUILD_DIR}/firmware.uf2" ]; then
              cp "${BUILD_DIR}/firmware.uf2" "../../${TARGET_FILENAME}"
              echo "✅ 编译成功: ${TARGET_FILENAME}"
            else
              echo "❌ 编译失败: 未生成 ${BUILD_DIR}/firmware.uf2"
              exit 1
            fi
          done

      - name: Verify UF2 Architecture Safety (Family ID Check)
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          UF2_FILE=$(ls RetroMagic_MicroPython_RP2350_4MB_*.uf2 | head -n 1)
          if [ -f "$UF2_FILE" ]; then
            echo "🔍 检查 UF2 文件架构: $UF2_FILE"
            python3 -c "
          with open('$UF2_FILE', 'rb') as f:
              data = f.read(512)
              family_id = int.from_bytes(data[28:32], 'little')
              print(f'Family ID: {hex(family_id)}')
              if family_id == 0xe48da566:
                  print('✅ UF2 架构校验通过: RP2350 ARM-S (0xe48da566)')
              else:
                  print('⚠️ 警告: Family ID 不匹配 RP2350 ARM-S!')
          "
          fi

      - name: Generate Release Notes File
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          COMMIT="${{ steps.get_version.outputs.commit }}"
          cat << EOF > release_notes.md
          # RetroMagic RP2350 Custom MicroPython Firmware

          基于 MicroPython 官方 Master 分支自动构建。

          - **MicroPython 版本**: \`${VERSION}\`
          - **Commit Hash**: \`${COMMIT}\`
          - **构建时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### 固件列表：
          - \`RetroMagic_MicroPython_RP2350_2MB_${VERSION}.uf2\`
          - \`RetroMagic_MicroPython_RP2350_4MB_${VERSION}.uf2\`
          - \`RetroMagic_MicroPython_RP2350_8MB_${VERSION}.uf2\`
          - \`RetroMagic_MicroPython_RP2350_16MB_${VERSION}.uf2\`
          EOF

      - name: Publish to GitHub Releases
        if: steps.check_release.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: RetroMagic MicroPython RP2350 (${{ steps.get_version.outputs.version }})
          body_path: release_notes.md
          files: RetroMagic_MicroPython_RP2350_*.uf2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
